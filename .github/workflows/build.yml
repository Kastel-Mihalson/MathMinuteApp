name: Build apps

# Запускается при каждом push в main и вручную (Actions → Build apps → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: Минутка

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # В репозитории лежит только код приложения.
      # Папки android/ и ios/ создаются автоматически, если их ещё нет.
      - name: Generate platform folders
        run: flutter create . --platforms=android,ios --org com.example.minutka --project-name minutka

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_NAME }}"/' android/app/src/main/AndroidManifest.xml

      # Чёрный экран при старте на части Android-устройств связан с графическим
      # движком Impeller. Отключаем его, приложению он не нужен.
      - name: Disable Impeller on Android
        run: sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # Постоянный ключ подписи: так новая сборка ставится ПОВЕРХ старой,
      # и данные приложения не удаляются. Ключ хранится не в репозитории,
      # а в секрете GitHub ANDROID_KEYSTORE_BASE64 (Settings -> Secrets and variables -> Actions).
      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Постоянный ключ подписи подключён"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан: APK подписан временным ключом и не встанет поверх старой версии."
          fi

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: minutka-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS (без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android,ios --org com.example.minutka --project-name minutka

      - name: Set app name
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ env.APP_NAME }}" ios/Runner/Info.plist

      # Без этих строк iOS закроет приложение при выборе фото для аватара.
      - name: Add camera and photo library permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Камера нужна, чтобы сделать фото для аватара" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Галерея нужна, чтобы выбрать фото для аватара" ios/Runner/Info.plist || true

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr minutka-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: minutka-ios-unsigned
          path: minutka-unsigned.ipa
